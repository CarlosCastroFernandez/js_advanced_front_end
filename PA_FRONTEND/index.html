<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/svg+xml" href="/vite.svg" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>pa-frontend</title>
</head>

<body>
  <header id="header"></header>
  <main id="app">

    <section class="section-login">
      <div class="container-img-login">
          <img src="./src/img/fondo_ajuste.png"   alt="">
      </div>

      <div class="container-login">
        <h1 style="text-align: center;">¡BIENVENIDO A TU PANEL!</h1>
        <div class="group-button-login">
          <button class="button-singin">Sign-in</button>
          <button class="button-singup">Sign-up</button>
        </div>
        <form action="" class="form-singin" >
          <label for="email-login">Correo</label>
          <input id="email-login" type="email" required>
          <label for="password-login">Contraseña</label>
          <input id="password-login" type="password" required minlength="3" maxlength="10">
          <button type="submit" class="inicio"> Iniciar Sesión</button>
        </form>
        <form action="" class="form-singup" style="display: none;">
          <label for="name-register">Nombre</label>
          <input id="name-register" type="text" minlength="3" maxlength="30" autofocus required>
          <label for="lastName-register">Apellidos</label>
          <input id="lastName-register" type="text" min="3" maxlength="30" required>
          <label for="email-register">Correo</label>
          <input id="email-register" type="email" required>
          <label for="password-register">Contraseña</label>
          <input id="password-register" type="password" required minlength="3" maxlength="10">
          <label for="password-register2">Repite Contraseña</label>
          <input id="password-register2" type="password" required minlength="3" maxlength="10">
          <button type="submit" class="inicio-register"> Registrarse</button>
        </form>
      </div>
    </section>
  </main>

  <!-- LO PRIMERO DE TODO EL LOG-IN-->

  <div id="miModal" class="modal" style="display: none;">
    <div class="modal-contenido">
      <span class="cerrar">&times;</span>
      <form class="form-newUser">
        <h2>Nuevo Usuario</h2>
        <label for="name">Nombre</label>
        <input id="name" type="text" minlength="3" maxlength="30" autofocus required>
        <label for="lastName">Apellidos</label>
        <input id="lastName" type="text" min="3" maxlength="30" required>
        <label for="email">Correo</label>
        <input id="email" type="email" required>
        <label for="password">Contraseña</label>
        <input id="password" type="password" required minlength="3" maxlength="10">
        <div>
          <input type="radio" name="grupo1" id="user-radio">
          <label for="user-radio">Usuario</label>
          <input type="radio" name="grupo1" id="admin-radio">
          <label for="admin-radio">Administrador</label>
          <label for="active">¿Activo?</label>
          <input id="active" type="checkbox">
        </div>

        <button id="accionModal">Aceptar</button>
      </form>

    </div>
  </div>

  <div id="miModal2" class="modal2" style="display: none;">
    <div class="modal-contenido2">
      <span class="cerrar2">&times;</span>
      <form class="user-detail">
        <h2>Detalles del Usuario</h2>
        <label for="name2">Nombre</label>
        <input id="name2" type="text" minlength="3" maxlength="30" autofocus required>
        <label for="lastName2">Apellidos</label>
        <input id="lastName2" type="text" min="3" maxlength="30" required>
        <label for="email2">Correo</label>
        <input id="email2" type="email" required>
        <label for="password2">Contraseña</label>
        <input id="password2" type="password" required minlength="3" maxlength="10">
        <div>
          <input type="radio" name="grupo1" id="user-radio2">
          <label for="user-radio2">Usuario</label>
          <input type="radio" name="grupo1" id="admin-radio2">
          <label for="admin-radio2">Administrador</label>
          <label for="active">¿Activo?</label>
          <input id="active" type="checkbox">

        </div>

        <button id="accionModal2">Modificar</button>
      </form>

    </div>
  </div>

  <script type="module" src="/src/main.js"></script>
</body>

</html>
